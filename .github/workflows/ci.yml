name: Omisha OS CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile licensing/server.py onprem/agent.py module-runtime/app.py
      - name: Docker builds
        run: |
          docker build -t omisha-license:ci licensing
          docker build -t omisha-module-runtime:ci module-runtime
      - name: Compose syntax
        run: OMISHA_LICENSE_ADMIN_TOKEN=ci-token docker compose -f licensing/compose.yml config --quiet
