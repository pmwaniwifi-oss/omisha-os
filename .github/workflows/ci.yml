name: Omisha OS CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile control/server.py tenant-app/app.py
      - name: Docker builds
        run: |
          docker build -t omisha-control:ci ./control
          docker build -t omisha-tenant-app:3.1 ./tenant-app
      - name: Compose syntax
        run: |
          OMISHA_HOST_ROOT=/opt/omisha-os ADMIN_TOKEN=dummy SHARED_POSTGRES_PASSWORD=dummy docker compose config --quiet
