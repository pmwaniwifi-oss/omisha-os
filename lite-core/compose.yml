services:
  lite:
    build: .
    restart: unless-stopped
    init: true
    environment:
      OMISHA_LITE_TOKEN: ${OMISHA_LITE_TOKEN:?Set a strong token}
      OMISHA_MODULES: ${OMISHA_MODULES:-core}
      OMISHA_REGISTRY_PATH: /data/companies.json
      GOMEMLIMIT: 96MiB
      GOGC: "100"
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - lite-data:/data
    read_only: true
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  lite-data:
